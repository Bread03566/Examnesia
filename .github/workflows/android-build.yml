name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Https origin of the Kabisado backend API (defaults to vars.VITE_API_BASE)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Build native frontend bundle & sync Capacitor Android
        env:
          VITE_API_BASE: ${{ inputs.api_base || vars.VITE_API_BASE }}
          VITE_PLATFORM: native
        run: |
          npm run build:native
          npx cap sync android

      - name: Assemble Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabisado-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
